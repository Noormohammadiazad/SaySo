[package]
name = "sayso-wasm"
description = "The JavaScript-facing API of the Sayso core and wire protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sayso-core.workspace = true
sayso-wire = { path = "../sayso-wire" }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
n0-future = "0.3"
# Both major versions are in the dependency tree; each needs its browser backend enabled.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
